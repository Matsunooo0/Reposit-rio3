<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartões 3D</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section class="cartoes">

    <article class="cartao">
        <div class="cartao-interno">
            <div class="cartao-frente">
                <h2>Cartão 1</h2>
                <p>Passe o mouse aqui!</p>
            </div>

            <div class="cartao-verso">
                <h2>Surpresa!</h2>
                <p>Você encontrou o primeiro cartão.</p>
            </div>
        </div>
    </article>

    <article class="cartao">
        <div class="cartao-interno">
            <div class="cartao-frente">
                <h2>Cartão 2</h2>
                <p>Passe o mouse aqui!</p>
            </div>

            <div class="cartao-verso">
                <h2>Parabéns!</h2>
                <p>Você encontrou o segundo cartão.</p>
            </div>
        </div>
    </article>

</section>

</body>

</html>
